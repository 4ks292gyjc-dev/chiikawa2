<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#244f3e">
  <title>치이카와: 씨앗 수호대</title>
  <style>
    :root { background:#101d19; color:#fffdf6; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; }
    #shell { width:min(100vw, 540px); height:100svh; max-height:960px; position:relative; background:#244f3e; overflow:hidden; box-shadow:0 0 44px #000a; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    .panel { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; background:#244f3e; text-align:center; gap:14px; }
    .panel.hidden { display:none; }
    h1 { font-size:clamp(28px,8vw,44px); margin:0; letter-spacing:-.05em; text-shadow:0 3px #132b22; }
    p { margin:0; color:#d9ead0; line-height:1.55; }
    .hero { width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 7px 0 #163527); }
    button { border:0; border-radius:14px; width:min(100%,330px); padding:17px; font:700 18px inherit; color:#fffdf6; background:#ee8ea6; box-shadow:0 5px #b75e76; cursor:pointer; }
    button:active { transform:translateY(4px); box-shadow:0 1px #b75e76; }
    button.alt { background:#7f68ba; box-shadow:0 5px #56458a; }
    button.green { background:#4f9c64; box-shadow:0 5px #2d6b3e; }
    .seed { color:#ffe383; font-weight:800; }
    #choose { justify-content:flex-start; overflow:auto; padding-top:24px; }
    #cards { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:430px; }
    .card { padding:12px 6px; border-radius:16px; background:#ffffff18; border:2px solid #ffffff24; }
    .card.selected { border-color:#ffe383; background:#ffe38322; }
    .card.locked { filter:grayscale(1); opacity:.56; }
    .card img { width:86px; height:86px; object-fit:contain; }
    .card small { display:block; color:#cde2d0; }
    #upgrade { justify-content:center; }
    #upgrade h2 { margin:0; }
    #startSelect { justify-content:flex-start; overflow:auto; padding-top:40px; }
    #startSelect h2 { margin:0; }
    #startOptions { width:100%; max-width:410px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:4px 0 12px; }
    #startOptions button { width:100%; min-height:76px; padding:10px 8px; font-size:16px; line-height:1.25; }
    #startOptions button small { display:block; margin-top:5px; color:#e4f3d7; font-size:12px; font-weight:600; }
    #startOptions .bossStart { background:#7f68ba; box-shadow:0 5px #56458a; }
    #toast { position:absolute; z-index:4; left:50%; bottom:16%; transform:translateX(-50%); padding:10px 14px; border-radius:999px; background:#10271ddd; color:#fff; font-weight:800; display:none; }
    #pauseBtn { position:absolute; z-index:3; top:14px; right:14px; width:auto; padding:8px 12px; border-radius:10px; font-size:14px; background:#1a2c23dd; box-shadow:0 3px #102018; }
    #pauseBtn.hidden { display:none; }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="game" aria-label="치이카와 씨앗 수호대 게임"></canvas>
    <div id="toast"></div>
    <button id="pauseBtn" class="hidden" aria-label="게임 일시정지">Ⅱ</button>
    <section class="panel" id="home">
      <h1>치이카와<br>씨앗 수호대</h1>
      <p>움직이고, 맞추고, 성장하세요</p>
      <img class="hero" src="chii.png" alt="치이카와">
      <button class="green" id="play">게임 시작</button>
      <button class="alt" id="characters">캐릭터 선택</button>
      <button id="gachaBtn">캐릭터 뽑기 · 씨앗 100</button>
      <p class="seed">씨앗 <span id="seedCount">300</span></p>
      <p>손가락으로 이동 · 가까운 적 자동 공격</p>
    </section>
    <section class="panel hidden" id="startSelect">
      <h2>시작 웨이브 선택</h2>
      <p id="startHint">도전할 지점을 골라주세요.</p>
      <div id="startOptions"></div>
      <button class="alt" id="startBack">돌아가기</button>
    </section>
    <section class="panel hidden" id="choose">
      <h2>캐릭터 선택</h2>
      <p>각 캐릭터의 능력으로 씨앗을 지켜요.</p>
      <div id="cards"></div>
      <button id="enhance">선택 캐릭터 강화 · 씨앗 80</button>
      <button class="green" id="back">선택 완료</button>
    </section>
    <section class="panel hidden" id="upgrade">
      <h2>레벨 업!</h2>
      <p>하나의 능력을 골라주세요.</p>
      <div id="upgradeChoices"></div>
    </section>
    <section class="panel hidden" id="pause">
      <h2>일시정지</h2>
      <p>잠시 쉬어가도 괜찮아요.</p>
      <button class="green" id="resume">계속하기</button>
      <button class="alt" id="exitGame">메인 화면으로</button>
    </section>
    <section class="panel hidden" id="gacha">
      <h2>별빛 뽑기</h2>
      <p>씨앗 100개로 새로운 동료를 만나요.</p>
      <img class="hero" id="gachaImage" src="chii.png" alt="캐릭터 뽑기">
      <p id="gachaResult">아직 뽑지 않았어요.</p>
      <button class="green" id="roll">한 번 뽑기 · 씨앗 100</button>
      <button class="alt" id="gachaBack">돌아가기</button>
    </section>
    <section class="panel hidden" id="result">
      <h2 id="resultTitle">수호 성공!</h2>
      <p id="resultText"></p>
      <button class="green" id="again">한 번 더 하기</button>
      <button class="alt" id="homeBtn">처음으로</button>
    </section>
  </main>
  <script>
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),shell=document.querySelector('#shell');
  const panels=['home','startSelect','choose','upgrade','gacha','pause','result'].reduce((o,id)=>(o[id]=document.querySelector('#'+id),o),{}),toast=document.querySelector('#toast'),pauseBtn=document.querySelector('#pauseBtn');
  const roster=[['chii','치이카와','안정 조준 · 공격력 증가'],['hachi','하치와레','빠른 손놀림 · 공격 속도 증가'],['usagi','우사기','토끼걸음 · 이동 속도 증가'],['momonga','모몽가','구름 회피 · 회피 증가'],['rakko','라코','단단한 털 · 최대 HP 증가'],['kurimanjyu','쿠리만쥬','찻잔 방패 · 피해 감소'],['shisa','시사','사자 포효 · 폭발 범위 증가'],['furuhonya','후루혼야','차분한 독서 · 경험치 증가']];
  const imgs={};roster.forEach(([id])=>{imgs[id]=new Image();imgs[id].src=id+'.png'});
  const enemyImgs={};['slime','bee','bear','shooter','charger','splitter','boss'].forEach(id=>{enemyImgs[id]=new Image();enemyImgs[id].src='enemy-'+id+'.png'});
  const upgrades=[
    ['추가 발사체','기본 화살 +1','multi'],['전방 화살','정면 추가 화살','front'],['후방 화살','뒤로도 화살 발사','rear'],['측면 화살','양옆 화살 발사','side'],['강화 화살','화살 피해 +28%','damage'],['속사','공격 간격 -13%','rapid'],
    ['적 관통','관통 횟수 +1','pierce'],['벽 반사','벽에서 화살 반사','wall'],['적 사이 연쇄','연쇄 번개 +1','chain'],['바운스','적중 후 가까운 적에게 도약','bounce'],
    ['화염 화살','불타는 피해 강화','burn'],['맹독 화살','독 피해를 남김','poison'],['빙결 화살','감속 효과 강화','frost'],['번개 폭발','연쇄 피해 증가','lightning'],
    ['정령 소환','정령이 추가 공격','spirit'],['회전 칼날','주변 적을 베어냄','orbit'],['충격파','주기적으로 주변에 충격파','shockwave'],['폭발 화살','적중 시 광역 폭발','blast'],
    ['심장 강화','최대 HP +20','maxhp'],['치유의 별','최대 HP의 28% 회복','heal'],['피해 감소','받는 피해 -10%','reduction'],['보호막','피격 1회 방어','shield'],['부활','사망 시 1회 부활','revive'],
    ['신속','이동 속도 +12%','speed'],['바람 회피','회피 확률 +8%','dodge'],['처치 회복','적 처치 시 HP 회복','lifesteal'],['연속 사격','연속 적중 시 피해 증가','combo'],
    ['거대 화살','피해 +48%, 발사 간격 +8%','giant'],['성스러운 별빛','피해·HP·속도 소폭 상승','holy']
  ];
  let selected=0,state='home',last=0,joystick=null,game,seed=+(localStorage.chiiSeeds||300),owned=JSON.parse(localStorage.chiiOwned||'[true,false,false,false,false,false,false,false]'),levels=JSON.parse(localStorage.chiiLevels||'[1,1,1,1,1,1,1,1]'),bestWave=Math.max(1,+(localStorage.chiiBestWave||1));
  const show=n=>{Object.values(panels).forEach(p=>p.classList.add('hidden'));if(n)panels[n].classList.remove('hidden')},announce=t=>{toast.textContent=t;toast.style.display='block';clearTimeout(announce.t);announce.t=setTimeout(()=>toast.style.display='none',1250)};
  function persist(){localStorage.chiiSeeds=seed;localStorage.chiiOwned=JSON.stringify(owned);localStorage.chiiLevels=JSON.stringify(levels);localStorage.chiiBestWave=bestWave;document.querySelector('#seedCount').textContent=seed}
  function resize(){let r=shell.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();persist();
  function openRoster(){show('choose');let cards=document.querySelector('#cards');cards.innerHTML='';roster.forEach((c,i)=>{let b=document.createElement('button');b.className='card '+(i===selected?'selected ':'')+(!owned[i]?'locked':'');b.innerHTML=`<img src="${c[0]}.png" alt=""><strong>${owned[i]?c[1]:'잠긴 동료'} · Lv.${levels[i]}</strong><small>${owned[i]?c[2]:'뽑기에서 획득'}</small>`;b.onclick=()=>{if(owned[i]){selected=i;openRoster()}else announce('별빛 뽑기에서 획득하세요')};cards.append(b)})}
  function openGacha(){show('gacha');document.querySelector('#gachaResult').textContent=`보유 씨앗 ${seed}`}
  document.querySelector('#characters').onclick=openRoster;document.querySelector('#back').onclick=()=>show('home');document.querySelector('#enhance').onclick=()=>{if(seed<80){announce('씨앗이 부족해요');return}seed-=80;levels[selected]++;persist();announce(`${roster[selected][1]} Lv.${levels[selected]}!`);openRoster()};document.querySelector('#gachaBtn').onclick=openGacha;document.querySelector('#gachaBack').onclick=()=>show('home');
  document.querySelector('#roll').onclick=()=>{if(seed<100){announce('씨앗이 부족해요');return}seed-=100;let candidates=roster.map((_,i)=>i).filter(i=>!owned[i]);let pick=candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:Math.floor(Math.random()*roster.length);owned[pick]=true;selected=pick;persist();document.querySelector('#gachaImage').src=`${roster[pick][0]}.png`;document.querySelector('#gachaResult').textContent=`${roster[pick][1]} 획득! ${roster[pick][2]}`};
  let startReturn='home';function openStartSelect(back='home'){startReturn=back;let box=document.querySelector('#startOptions');box.innerHTML='';document.querySelector('#startHint').textContent=`최고 기록 웨이브 ${bestWave} · 원하는 지점부터 시작`;for(let w=1;w<=bestWave;w++){let b=document.createElement('button'),boss=w%5===0;b.className=boss?'bossStart':'';b.innerHTML=`${boss?'보스전':'웨이브'} ${w}<small>${w===1?'처음부터':'강화 보정 적용'}</small>`;b.onclick=()=>start(w);box.append(b)}show('startSelect')}
  document.querySelector('#play').onclick=()=>openStartSelect('home');document.querySelector('#again').onclick=()=>openStartSelect('result');document.querySelector('#startBack').onclick=()=>show(startReturn);document.querySelector('#homeBtn').onclick=()=>{state='home';pauseBtn.classList.add('hidden');show('home')};pauseBtn.onclick=()=>{if(state==='play'){state='pause';joystick=null;pauseBtn.classList.add('hidden');show('pause')}};document.querySelector('#resume').onclick=()=>{state='play';show();pauseBtn.classList.remove('hidden');last=performance.now();requestAnimationFrame(loop)};document.querySelector('#exitGame').onclick=()=>{state='home';joystick=null;pauseBtn.classList.add('hidden');show('home')};
  const quotaFor=wave=>Math.min(30,10+(Math.min(wave,5)-1)*5);
  function start(startWave=1){startWave=Math.max(1,Math.min(startWave,bestWave));let id=roster[selected][0],skip=Math.max(0,startWave-1);game={x:.5,y:.55,hp:100,maxHp:100,speed:.30,damage:10,interval:.44,shots:1,pierce:0,bounce:0,chain:0,burn:0,poison:0,frost:0,wall:0,front:0,rear:0,side:0,spirit:0,orbit:0,blast:0,shockwave:0,reduction:0,revive:0,dodge:0,lifesteal:0,combo:0,lightning:0,up:{},lastShot:0,assist:0,shock:2,xp:0,need:22,level:1,wave:startWave,kills:0,quota:quotaFor(startWave),spawn:0,enemies:[],bullets:[],enemyShots:[],boss:startWave%5===0,finished:false,runSeeds:0};if(id==='chii')game.damage=13;if(id==='hachi')game.interval=.34;if(id==='usagi')game.speed=.36;if(id==='rakko'){game.maxHp=135;game.hp=135}if(id==='kurimanjyu')game.shield=2;if(id==='shisa')game.burn=4;if(id==='furuhonya')game.xpRate=1.3;game.damage+=(levels[selected]-1)*2+skip*2.4;game.maxHp+=(levels[selected]-1)*6+skip*9;game.hp=game.maxHp;state='play';show();pauseBtn.classList.remove('hidden');if(startWave>1)announce(`웨이브 ${startWave}부터 재도전!`);last=performance.now();requestAnimationFrame(loop)}
  function spawn(){let g=game,type=g.boss?'boss':(['slime','bee','bear','shooter','charger','splitter'][Math.floor(Math.random()*Math.min(6,2+g.wave))]);let side=Math.floor(Math.random()*4),x,y;if(side===0){x=.06+Math.random()*.88;y=.18}else if(side===1){x=.94;y=.18+Math.random()*.55}else if(side===2){x=.06+Math.random()*.88;y=.73}else{x=.06;y=.18+Math.random()*.55}let data={slime:[15,.021,.034,'#f49b87'],bee:[10,.044,.025,'#f5d65a'],bear:[42,.015,.050,'#996b55'],shooter:[22,.015,.038,'#aa85d2'],charger:[20,.010,.035,'#ee6a6a'],splitter:[25,.018,.042,'#63c7ad'],boss:[245,.014,.09,'#c85575']}[type],difficulty=1+(g.wave-1)*.18+Math.max(0,g.wave-10)*.025,maxHp=data[0]*difficulty;g.enemies.push({x,y,type,hp:maxHp,maxHp,speed:data[1]*(1+(g.wave-1)*.055),r:data[2],color:data[3],shot:type==='shooter'?2.35:1.6,charge:0,burn:0,poison:0,slow:0,boss:type==='boss',pattern:0,patternTimer:Math.max(1.25,2.7-g.wave*.035)});}
  function chooseUpgrade(){let pool=upgrades.filter(u=>u[2]!=='lightning'||game.chain>0),pick=[];while(pick.length<3&&pool.length)pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);let box=document.querySelector('#upgradeChoices');box.innerHTML='';pick.forEach((u,i)=>{let b=document.createElement('button');b.className=i===1?'alt':i===2?'green':'';b.textContent=`${u[0]} · ${u[1]}`;b.onclick=()=>applyUpgrade(u[2],u[0]);box.append(b)});state='upgrade';pauseBtn.classList.add('hidden');show('upgrade')}
  function applyUpgrade(k,name){let g=game;g.up[k]=(g.up[k]||0)+1;if(k==='multi')g.shots++;if(k==='front')g.front++;if(k==='rear')g.rear++;if(k==='side')g.side++;if(k==='damage')g.damage*=1.28;if(k==='rapid')g.interval*=.87;if(k==='speed')g.speed*=1.12;if(k==='pierce')g.pierce++;if(k==='wall')g.wall++;if(k==='bounce')g.bounce++;if(k==='burn')g.burn+=4;if(k==='poison')g.poison+=4;if(k==='chain')g.chain++;if(k==='lightning')g.lightning+=.18;if(k==='frost')g.frost+=.25;if(k==='spirit')g.spirit++;if(k==='orbit')g.orbit++;if(k==='blast')g.blast+=.05;if(k==='shockwave')g.shockwave++;if(k==='giant'){g.damage*=1.48;g.interval*=1.08}if(k==='heal')g.hp=Math.min(g.maxHp,g.hp+g.maxHp*.28);if(k==='maxhp'){g.maxHp+=20;g.hp+=20}if(k==='shield')g.shield++;if(k==='reduction')g.reduction=Math.min(.65,g.reduction+.10);if(k==='revive')g.revive++;if(k==='dodge')g.dodge=Math.min(.55,g.dodge+.08);if(k==='lifesteal')g.lifesteal+=1.5;if(k==='combo')g.combo+=.08;if(k==='holy'){g.damage*=1.12;g.maxHp+=10;g.hp+=10;g.speed*=1.06}state='play';show();pauseBtn.classList.remove('hidden');announce(`${name} Lv.${g.up[k]} 획득!`);last=performance.now();requestAnimationFrame(loop)}
  function loop(now){if(state!=='play')return;let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
  function hitPlayer(amount){let g=game;if(Math.random()<g.dodge){announce('회피!');return}if(g.shield>0){g.shield--;announce('방패가 막아냈어요!');return}g.hp-=amount*(1-g.reduction)}
  function shoot(){let g=game,target=g.enemies.reduce((best,e)=>!best||Math.hypot(e.x-g.x,e.y-g.y)<Math.hypot(best.x-g.x,best.y-g.y)?e:best,null);if(!target)return;let aimed=Math.atan2(target.y-g.y,target.x-g.x),angles=[aimed],fixed=[];for(let i=0;i<g.shots;i++)fixed.push(aimed+(i-(g.shots-1)/2)*.28);for(let i=0;i<g.front;i++)fixed.push(-Math.PI/2);for(let i=0;i<g.rear;i++)fixed.push(Math.PI/2);for(let i=0;i<g.side;i++)fixed.push(Math.PI,0);angles.push(...fixed);angles.forEach(d=>g.bullets.push({x:g.x,y:g.y,vx:Math.cos(d)*.85,vy:Math.sin(d)*.85,life:1.35,pierce:g.pierce,bounce:g.bounce,wall:g.wall}))}
  function update(dt){let g=game;let vx=joystick?joystick.x:0,vy=joystick?joystick.y:0,stationary=Math.hypot(vx,vy)<.04;g.x=Math.max(.09,Math.min(.91,g.x+vx*g.speed*dt));g.y=Math.max(.23,Math.min(.69,g.y+vy*g.speed*dt));g.spawn-=dt;let cap=g.boss?1:Math.min(10,4+g.wave);if(g.spawn<0&&g.enemies.length<cap&&!g.finished){spawn();g.spawn=g.boss?99:Math.max(.30,.78-g.wave*.04)}if(stationary&&g.enemies.length&&performance.now()-g.lastShot>g.interval*1000){g.lastShot=performance.now();shoot()}g.assist-=dt;if(stationary&&g.spirit&&g.assist<0){g.assist=Math.max(.55,1.35-g.spirit*.08);for(let i=0;i<g.spirit;i++)shoot()}g.shock-=dt;if(stationary&&g.shockwave&&g.shock<0){g.shock=Math.max(1.3,3.8-g.shockwave*.18);g.enemies.forEach(e=>{if(Math.hypot(e.x-g.x,e.y-g.y)<.20+.025*g.shockwave)e.hp-=g.damage*(.55+.08*g.shockwave)})}
    g.enemies.forEach(e=>{let dx=g.x-e.x,dy=g.y-e.y,l=Math.hypot(dx,dy)||1;e.slow=Math.max(0,e.slow-dt);let m=e.speed*(e.slow?.45:1);if(e.type==='bee'){e.x+=Math.cos(performance.now()/180+e.y*10)*.015*dt;e.y+=Math.sin(performance.now()/160+e.x*10)*.015*dt}e.x+=dx/l*m*dt;e.y+=dy/l*m*dt;e.shot-=dt;if(e.type==='shooter'&&e.shot<0){e.shot=2.35;g.enemyShots.push({x:e.x,y:e.y,vx:dx/l*.18,vy:dy/l*.18,life:2.6,damage:5})}if(e.type==='charger'&&e.charge<=0&&l<.3){e.charge=.35;e.speed=.15}if(e.charge>0){e.charge-=dt;if(e.charge<=0)e.speed=.010}if(e.boss){e.patternTimer-=dt;if(e.patternTimer<0){e.pattern=(e.pattern+1)%4;e.patternTimer=[1.55,1.45,.75,2.5][e.pattern];if(e.pattern===0){for(let i=0;i<8;i++){let a=i*Math.PI/4;g.enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*.20,vy:Math.sin(a)*.20,life:4,damage:7})}}if(e.pattern===1){for(let i=-1;i<=1;i++){let a=Math.atan2(dy,dx)+i*.18;g.enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*.30,vy:Math.sin(a)*.30,life:3,damage:7})}}if(e.pattern===2){e.charge=.48;e.speed=.18}if(e.pattern===3){for(let i=0;i<5;i++){let a=Math.atan2(dy,dx)+(i-2)*.24;g.enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*.23,vy:Math.sin(a)*.23,life:3,damage:6})}}}}if(l<e.r+.032)hitPlayer((e.boss?14:7)*dt)});
    g.enemyShots.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-g.x,b.y-g.y)<.035){b.life=0;hitPlayer(b.damage||5)}});g.enemyShots=g.enemyShots.filter(b=>b.life>0&&b.x>.04&&b.x<.96&&b.y>.16&&b.y<.76);
    g.bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let outside=b.x<.06||b.x>.94||b.y<.18||b.y>.73;if(outside&&b.wall>0){if(b.x<.06||b.x>.94)b.vx*=-1;if(b.y<.18||b.y>.73)b.vy*=-1;b.wall--}else if(outside)b.life=0;for(let e of g.enemies){if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+.014){let damage=g.damage*(1+g.combo*.04);e.hp-=damage;e.burn=Math.max(e.burn,g.burn);e.poison=Math.max(e.poison,g.poison);e.slow=Math.max(e.slow,g.frost);if(g.blast)g.enemies.forEach(q=>{if(q!==e&&Math.hypot(q.x-e.x,q.y-e.y)<g.blast)q.hp-=damage*.45});if(g.chain){g.enemies.filter(q=>q!==e).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y)).slice(0,g.chain).forEach(q=>q.hp-=damage*(.42+g.lightning))}if(b.pierce--<=0){b.life=0;if(b.bounce>0){b.bounce--;let n=g.enemies.find(q=>q!==e&&!q.dead);if(n){let l=Math.hypot(n.x-e.x,n.y-e.y)||1;g.bullets.push({x:e.x,y:e.y,vx:(n.x-e.x)/l*.85,vy:(n.y-e.y)/l*.85,life:.7,pierce:0,bounce:b.bounce,wall:0})}}}break}}});g.bullets=g.bullets.filter(b=>b.life>0);

  function finish(win){state='end';pauseBtn.classList.add('hidden');persist();document.querySelector('#resultTitle').textContent=win?'보스 격파!':'다음엔 꼭 지켜요!';document.querySelector('#resultText').textContent=`${roster[selected][1]} · Lv.${game.level} · 웨이브 ${game.wave} · 획득 씨앗 +${game.runSeeds}`;show('result')}
  function monster(e,x,y,s){ctx.save();ctx.translate(x,y);let sprite=enemyImgs[e.boss?'boss':e.type];if(sprite&&sprite.complete&&sprite.naturalWidth){let scale=e.boss?1.45:1.28;ctx.drawImage(sprite,-s*scale,-s*scale,s*scale*2,s*scale*2);ctx.restore();return}ctx.lineWidth=2;ctx.strokeStyle='#382b32';if(e.type==='slime'){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,4,s,Math.PI,0);ctx.lineTo(s,8);ctx.lineTo(-s,8);ctx.fill();ctx.stroke();ctx.fillStyle='#382b32';ctx.fillRect(-s*.45,1,3,4);ctx.fillRect(s*.28,1,3,4)}else if(e.type==='bee'){ctx.fillStyle='#dff4ff';ctx.beginPath();ctx.ellipse(-s*.8,-s*.2,s*.75,s*.35,-.4,0,7);ctx.ellipse(s*.8,-s*.2,s*.75,s*.35,.4,0,7);ctx.fill();ctx.fillStyle='#f2c54b';ctx.beginPath();ctx.ellipse(0,0,s*.8,s*.55,0,0,7);ctx.fill();ctx.stroke();ctx.strokeStyle='#59402a';ctx.beginPath();ctx.moveTo(-s*.25,-s*.45);ctx.lineTo(-s*.35,s*.4);ctx.moveTo(s*.25,-s*.45);ctx.lineTo(s*.35,s*.4);ctx.stroke()}else if(e.type==='bear'){ctx.fillStyle='#805946';ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-s*.55,-s*.65,s*.32,0,7);ctx.arc(s*.55,-s*.65,s*.32,0,7);ctx.fill();ctx.fillStyle='#e5b98d';ctx.beginPath();ctx.ellipse(0,s*.3,s*.45,s*.3,0,0,7);ctx.fill()}else if(e.type==='shooter'){ctx.fillStyle='#563e83';ctx.beginPath();ctx.moveTo(-s,-s*.8);ctx.lineTo(0,-s*1.5);ctx.lineTo(s,-s*.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#c4a1ec';ctx.fillRect(-s*.65,-s*.75,s*1.3,s*1.45);ctx.fillStyle='#fff174';ctx.fillRect(-3,-s*.2,6,4)}else if(e.type==='charger'){ctx.fillStyle='#b54b4b';ctx.beginPath();ctx.moveTo(-s,-s*.5);ctx.lineTo(-s*.7,s);ctx.lineTo(s*.7,s);ctx.lineTo(s,-s*.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#dadce5';ctx.fillRect(-s*.45,-s*.8,s*.9,s*.55);ctx.fillStyle='#e83f50';ctx.fillRect(-s*.22,-s*.55,s*.44,4)}else if(e.type==='splitter'){ctx.fillStyle='#3e9987';ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=i%2?s*.65:s;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fi   function draw(){if(!game)return;let r=shell.getBoundingClientRect(),w=r.width,h=r.height,g=game,top=118,bottom=h*.76;ctx.clearRect(0,0,w,h);ctx.fillStyle='#244f3e';ctx.fillRect(0,0,w,h);ctx.fillStyle='#1a382d';ctx.fillRect(0,0,w,104);ctx.fillStyle='#75b66b';ctx.fillRect(16,top,w-32,bottom-top);ctx.strokeStyle='#ffffff20';for(let x=16;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}for(let y=top;y<bottom;y+=40){ctx.beginPath();ctx.moveTo(16,y);ctx.lineTo(w-16,y);ctx.stroke()}ctx.strokeStyle='#e9efb7';ctx.lineWidth=3;ctx.strokeRect(16,top,w-32,bottom-top);ctx.fillStyle='#fff';ctx.font='700 15px system-ui';ctx.fillText('CHIIKAWA',16,27);ctx.font='13px system-ui';ctx.fillStyle='#d5ead1';ctx.fillText(g.boss?'보스전 · 별빛 갑옷마왕':'웨이브 '+String(g.wave).padStart(2,'0')+' · 처치 '+g.kills+'/'+g.quota,16,50);ctx.fillText('LV '+g.level,w-67,27);ctx.fillStyle='#1a2c23';ctx.fillRect(16,67,w-32,10);ctx.fillStyle='#ec9aaf';ctx.fillRect(16,67,(w-32)*Math.max(0,g.hp)/g.maxHp,10);ctx.fillStyle='#1a2c23';ctx.fillRect(16,84,w-32,7);ctx.fillStyle='#ffe383';ctx.fillRect(16,84,(w-32)*g.xp/g.need,7);
    g.enemies.forEach(e=>{let x=e.x*w,y=e.y*h,s=e.r*w,ratio=Math.max(0,e.hp)/e.maxHp,bar=s*2,hp=bar*ratio;monster(e,x,y,s);if(e.burn||e.poison||e.slow){ctx.strokeStyle=e.burn?'#ff9c4e':e.poison?'#a8e76b':'#9deaff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,s+5,0,7);ctx.stroke()}ctx.fillStyle='#15251e';ctx.fillRect(x-bar/2,y-s-10,bar,4);ctx.fillStyle='#e9f4c8';ctx.fillRect(x-hp/2,y-s-10,hp,4)});g.enemyShots.forEach(b=>{ctx.fillStyle='#ad78e3';ctx.beginPath();ctx.arc(b.x*w,b.y*h,5,0,7);ctx.fill()});g.bullets.forEach(b=>{let c=g.lightning?'#d6b4ff':g.frost?'#9deaff':g.poison?'#b8ef74':g.burn?'#ffad57':'#fff2a2';ctx.strokeStyle=c;ctx.globalAlpha=.5;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x*w-b.vx*w*.025,b.y*h-b.vy*h*.025);ctx.lineTo(b.x*w,b.y*h);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=c;ctx.beginPath();ctx.arc(b.x*w,b.y*h,5,0,7);ctx.fill()});let px=g.x*w,py=g.y*h;if(g.shield){ctx.strokeStyle='#a9eaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,42,0,7);ctx.stroke()}for(let i=0;i<g.orbit;i++){let a=performance.now()/500+i*Math.PI*2/g.orbit;ctx.fillStyle='#d7e7ff';ctx.fillRect(px+Math.cos(a)*42-5,py+Math.sin(a)*42-5,10,10)}for(let i=0;i<g.spirit;i++){let a=performance.now()/700+i*Math.PI*2/g.spirit;ctx.fillStyle='#ffe383';ctx.beginPath();ctx.arc(px+Math.cos(a)*31,py+Math.sin(a)*31,5,0,7);ctx.fill()}ctx.drawImage(imgs[roster[selected][0]],px-36,py-42,72,72);let jx=joystick?joystick.cx*w:w/2,jy=joystick?joystick.cy*h:h-72;ctx.strokeStyle='#d7f1bd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(jx,jy,48,0,7);ctx.stroke();ctx.fillStyle='#e9a4b6';ctx.beginPath();ctx.arc(jx+(joystick?joystick.x*28:0),jy+(joystick?joystick.y*28:0),20,0,7);ctx.fill();ctx.fillStyle='#d4ead0';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('하단에서 터치한 위치에 조이스틱 생성',w/2,h-17);ctx.textAlign='left'}
  function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function setJoystick(e,start=false){let p=pos(e);if(start)joystick={x:0,y:0,cx:p.x,cy:p.y};let dx=(p.x-joystick.cx)/.13,dy=(p.y-joystick.cy)/.13,l=Math.hypot(dx,dy)||1;joystick.x=dx/l*Math.min(1,l);joystick.y=dy/l*Math.min(1,l)}canvas.addEventListener('pointerdown',e=>{if(state==='play'&&pos(e).y>.76){setJoystick(e,true);canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(joystick&&state==='play')setJoystick(e)});canvas.addEventListener('pointerup',()=>joystick=null);canvas.addEventListener('pointercancel',()=>joystick=null);
